name: Update IMDb Ratings

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-ratings:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update IMDb ratings
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import json, urllib.request, os, time
          API_KEY = os.environ['OMDB_API_KEY']
          with open('movies.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          updated = []
          for movie in data['movies']:
              imdb_id = movie.get('imdb_id')
              if not imdb_id or imdb_id == 'none':
                  continue
              try:
                  url = f'http://www.omdbapi.com/?i={imdb_id}&apikey={API_KEY}'
                  with urllib.request.urlopen(url, timeout=10) as r:
                      info = json.loads(r.read())
                  if info.get('Response') != 'True':
                      continue
                  rating_str = info.get('imdbRating', 'N/A')
                  if rating_str == 'N/A':
                      continue
                  new_rating = round(float(rating_str), 1)
                  if movie.get('imdb') != new_rating:
                      updated.append(f"{movie['title']}: {movie.get('imdb')} => {new_rating}")
                      movie['imdb'] = new_rating
                  time.sleep(0.2)
              except Exception as e:
                  print(f"Error: {e}")
          if updated:
              with open('movies.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print("Updated:", len(updated))
              for u in updated: print(" ", u)
          else:
              print("No changes.")
          PYEOF
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add movies.json
          git diff --cached --quiet || (git commit -m "Auto-update: IMDb ratings $(date +%Y-%m-%d)" && git push)
